name: Supabase Keep-Alive
on:
  schedule:
    - cron: "0 6 */5 * *" # Tous les 5 jours à 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/chefs_de_projet?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
