name: Deploy to Firebase Hosting and Supabase on merge

on:
  push:
    branches:
      - main

jobs:
  # 1. DÉPLOIEMENT SUPABASE (Edge Function)
  deploy_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Deploy Edge Function
        run: |
          supabase functions deploy generer-rendez-vous --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

